[pytest]
# Run from the python/ directory (conftest.py here puts the backend
# modules on sys.path and redirects on-disk state to a temp dir).
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q
# conftest.py blocks every non-loopback connect and DNS lookup; only a test
# marked `network` may reach the real network.
markers =
    network: a deliberate live check, allowed to reach the real network
